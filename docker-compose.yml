services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webintel
      POSTGRES_PASSWORD: webintel
      POSTGRES_DB: webintel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webintel"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: webintel
      MINIO_ROOT_PASSWORD: webintel12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://webintel:webintel@postgres:5432/webintel
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: webintel
      MINIO_SECRET_KEY: webintel12345
      MINIO_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

# Phase 3 adds: redis + a separate scheduler/worker process for continuous
# monitoring -- not needed until recurring crawls exist, so left out here
# to keep instant-crawl usage (this file) fast and light.

volumes:
  postgres_data:
  minio_data:
